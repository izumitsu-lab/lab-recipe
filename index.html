<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lab Recipe</title>
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: #121215;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #98989f;
            --accent-color: #2997ff;
            --accent-soft: rgba(41, 151, 255, 0.15);
            --reset-btn-bg: #ff453a;
            --border-radius: 24px;
        }

        body.light-theme {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --card-border: rgba(0, 0, 0, 0.08);
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent-color: #007aff;
            --accent-soft: rgba(0, 122, 255, 0.12);
            --reset-btn-bg: #ff3b30;
        }

        body.light-theme .main-display {
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
        }

        body.light-theme .mode-btn {
            background-color: #e5e5ea;
            color: #636366;
            border-color: rgba(0, 0, 0, 0.05);
        }
        body.light-theme .mode-btn.active {
            background-color: var(--accent-soft);
            color: var(--accent-color);
            border-color: rgba(0, 122, 255, 0.35);
        }

        body.light-theme .option-group,
        body.light-theme .option-item,
        body.light-theme .launcher-card,
        body.light-theme .cycle-step,
        body.light-theme .cycle-single-step,
        body.light-theme .guide-card,
        body.light-theme .keypad-btn {
            background-color: #f2f2f7;
            border-color: rgba(0, 0, 0, 0.06);
            color: var(--text-primary);
        }

        body.light-theme .ing-name {
            color: #2c2c2e;
        }

        body.light-theme .modal-content,
        body.light-theme .launcher-modal-content,
        body.light-theme .info-modal-content {
            background: #ffffff;
            border-color: rgba(0, 0, 0, 0.12);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.18);
        }

        body.light-theme .info-modal-body,
        body.light-theme .guide-desc {
            color: #3a3a3c;
        }
        body.light-theme .guide-desc b,
        body.light-theme .guide-desc strong,
        body.light-theme .info-modal-body b {
            color: #000000;
        }

        body.light-theme .info-close-btn {
            background: #e5e5ea;
            color: #1c1c1e;
            border-color: rgba(0, 0, 0, 0.08);
        }

        body.light-theme .keypad-btn.action-btn {
            background-color: #e5e5ea;
            color: #636366;
        }

        body.light-theme .keypad-divider-line {
            background-color: rgba(0, 0, 0, 0.1);
        }

        body.light-theme .bottom-launcher-bar {
            background-color: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            border-color: rgba(0, 0, 0, 0.08);
        }

        body.light-theme .launcher-fav-part,
        body.light-theme .launcher-main-part {
            border-right-color: rgba(0, 0, 0, 0.06);
        }

        body.light-theme .launcher-main-part:active {
            background-color: #f2f2f7;
        }

        body.light-theme .reset-banner {
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(255, 59, 48, 0.35);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
        }
        body.light-theme .reset-text {
            color: #d70015;
        }

        body.light-theme .slider {
            background-color: #e5e5ea;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 12px 16px env(safe-area-inset-bottom, 16px) 16px;
            width: 100%;
            max-width: 680px; /* iPad向けに横幅を自然に拡張 */
            margin: 0 auto;
            justify-content: space-between;
            overflow: hidden;
            opacity: 0;
            transition: background-color 0.25s, color 0.25s;
        }
        body.ready {
            opacity: 1;
        }

        /* iPad / タブレット向けレイアウト最適化 */
        @media screen and (min-width: 600px) {
            body {
                padding: 20px 24px env(safe-area-inset-bottom, 20px) 24px;
            }
            .main-display {
                padding: 24px 28px;
            }
            .media-title {
                font-size: 22px;
            }
            .ing-name {
                font-size: 18px;
            }
            .ing-amount {
                font-size: 20px;
            }
            .bottom-launcher-bar {
                height: 64px;
                border-radius: 26px;
            }
            .launcher-label {
                font-size: 16px;
            }
            .launcher-modal-content, .modal-content {
                max-width: 520px !important;
            }
        }

        .views-container {
            display: flex;
            width: 100%;
            flex: 1;
            overflow: hidden;
            margin-bottom: 8px;
            min-height: 0;
            position: relative;
        }

        .view-panel {
            min-width: 100%;
            width: 100%;
            flex-shrink: 0;
            display: none;
            flex-direction: column;
            min-height: 0;
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
        }

        .view-panel.active {
            display: flex;
        }

        .card-carousel-container {
            display: flex;
            width: 100%;
            flex: 1;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            min-height: 0;
        }
        .card-carousel-container::-webkit-scrollbar {
            display: none;
        }

        .card-carousel-panel {
            min-width: 100%;
            width: 100%;
            flex-shrink: 0;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 2px;
        }

        .main-display {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius);
            padding: 18px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
            overflow: hidden;
            transition: background-color 0.25s, border-color 0.25s;
        }

        .display-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 14px;
            padding-top: 4px;
            gap: 12px;
            flex-shrink: 0;
        }

        .media-title-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 0;
            cursor: pointer;
            padding: 8px 10px;
            margin: -8px -10px;
            border-radius: 14px;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background-color 0.2s, border-color 0.2s;
        }
        .media-title-wrapper:active {
            background-color: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .media-eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            text-transform: uppercase;
            opacity: 0.9;
        }

        .media-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .media-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-info-footer-btn {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            padding: 8px 4px 4px 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 4px;
            flex-shrink: 0;
            width: 100%;
            transition: color 0.2s;
        }
        .card-info-footer-btn span {
            border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
            padding-bottom: 1px;
            transition: border-color 0.2s, color 0.2s;
        }
        .card-info-footer-btn:active {
            opacity: 0.7;
        }
        .card-info-footer-btn:active span {
            color: var(--text-primary);
            border-color: var(--text-primary);
        }

        .volume-badge {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-color);
            background: var(--accent-soft);
            padding: 10px 16px;
            border-radius: 20px;
            letter-spacing: -0.3px;
            white-space: nowrap;
            flex-shrink: 0;
            cursor: pointer;
            border: 1.5px solid rgba(41, 151, 255, 0.3);
            transition: transform 0.15s, background-color 0.2s;
        }
        .volume-badge:active {
            transform: scale(0.95);
            background: rgba(41, 151, 255, 0.25);
        }

        .advice-box {
            background-color: rgba(41, 151, 255, 0.08);
            border: 1px solid rgba(41, 151, 255, 0.2);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 500;
            color: #70b5ff;
            display: none;
            flex-shrink: 0;
            line-height: 1.3;
        }
        .advice-box.visible {
            display: block;
        }
        body.light-theme .advice-box {
            background-color: rgba(0, 122, 255, 0.08);
            border-color: rgba(0, 122, 255, 0.25);
            color: #0066cc;
        }

        .cost-box {
            background-color: rgba(52, 199, 89, 0.08);
            border: 1px solid rgba(52, 199, 89, 0.2);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 500;
            color: #30d158;
            display: none;
            flex-shrink: 0;
            line-height: 1.3;
        }
        .cost-box.visible {
            display: block;
        }
        body.light-theme .cost-box {
            background-color: rgba(52, 199, 89, 0.12);
            border-color: rgba(52, 199, 89, 0.3);
            color: #248a3d;
        }

        .mode-switch-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .mode-btn {
            background-color: #1c1c20;
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            border-radius: 12px;
            padding: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background-color: var(--accent-soft);
            color: var(--accent-color);
            border-color: rgba(41, 151, 255, 0.4);
        }

        .list-container-wrapper {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding-top: 6px;
            padding-right: 2px;
            display: flex;
            flex-direction: column;
        }

        .list-container-wrapper::-webkit-scrollbar {
            width: 4px;
        }
        .list-container-wrapper::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        body.light-theme .list-container-wrapper::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
        }

        .ingredient-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 8px;
        }

        .recipe-section-header {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-top: 8px;
            margin-bottom: 4px;
            padding-top: 10px;
            border-top: 1px dashed var(--card-border);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ingredient-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            transition: opacity 0.2s;
            cursor: pointer;
            flex-shrink: 0;
        }

        .ingredient-item.checked .ing-name,
        .ingredient-item.checked .ing-amount,
        .ingredient-item.checked .ing-unit {
            color: #8e8e93 !important;
            text-decoration: line-through;
        }
        .ingredient-item.checked {
            opacity: 0.5;
        }

        .ing-name {
            color: #e5e5ea;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: -0.3px;
            transition: color 0.2s;
        }

        .ing-amount-wrapper {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .ing-amount {
            font-size: 18px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            transition: color 0.2s;
        }

        .ing-unit {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
            transition: color 0.2s;
        }

        .cycle-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 14px;
            padding-bottom: 16px;
        }

        .cycle-loop-group {
            position: relative;
            background: rgba(41, 151, 255, 0.04);
            border: 1px solid rgba(41, 151, 255, 0.2);
            border-radius: 16px;
            padding: 16px 12px 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        body.light-theme .cycle-loop-group {
            background: rgba(0, 122, 255, 0.04);
            border-color: rgba(0, 122, 255, 0.25);
        }

        .cycle-loop-badge {
            position: absolute;
            top: -10px;
            right: 14px;
            background: var(--accent-color);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 10px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(41, 151, 255, 0.4);
            z-index: 2;
        }

        .cycle-step {
            background-color: #1a1a1f;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cycle-step-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .cycle-step-name {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .cycle-main-val {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.5px;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .cycle-time {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-color);
            text-align: right;
        }

        .cycle-single-step {
            background-color: #1a1a1f;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cycle-divider {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            margin: 2px 0;
            letter-spacing: 1px;
        }

        .guide-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 16px;
        }

        .guide-card {
            background-color: #18181d;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .guide-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 6px;
            line-height: 1.4;
        }

        .guide-desc {
            font-size: 15px;
            color: #d1d1d6;
            line-height: 1.6;
        }
        .guide-desc b, .guide-desc strong {
            color: #ffffff;
        }

        .reset-banner {
            position: absolute;
            bottom: 12px;
            left: 16px;
            right: 16px;
            background: rgba(28, 28, 32, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 69, 58, 0.3);
            border-radius: 16px;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
        }

        .reset-banner.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .reset-text {
            font-size: 13px;
            font-weight: 600;
            color: #ffb3b0;
        }

        .reset-btn {
            background-color: var(--reset-btn-bg);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .reset-btn:active {
            transform: scale(0.95);
        }

        .option-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1c1c20;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
        }

        .option-label-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .option-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .option-desc {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .option-action-btn {
            background-color: var(--accent-soft);
            color: var(--accent-color);
            border: 1px solid rgba(41, 151, 255, 0.3);
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .option-action-btn:active {
            transform: scale(0.95);
        }

        .option-danger-btn {
            background-color: rgba(255, 69, 58, 0.12);
            color: var(--reset-btn-bg);
            border: 1px solid rgba(255, 69, 58, 0.3);
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #39393d;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        input:checked + .slider {
            background-color: var(--accent-color);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* 下部ランチャーバー */
        .bottom-launcher-bar {
            display: grid;
            grid-template-columns: 22% 1fr 18%;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            height: 56px;
            padding: 0;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            align-items: center;
        }

        .launcher-fav-part {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-right: 1px solid rgba(255,255,255,0.06);
            background: transparent;
            transition: background-color 0.2s, transform 0.15s;
        }
        .launcher-fav-part:active {
            background-color: rgba(255, 255, 255, 0.08);
            transform: scale(0.96);
        }
        .launcher-fav-icon {
            width: 20px;
            height: 20px;
            fill: var(--accent-color);
        }

        .launcher-main-part {
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 14px;
            cursor: pointer;
            background: transparent;
            transition: background-color 0.2s, transform 0.15s;
            border-right: 1px solid rgba(255,255,255,0.06);
        }
        .launcher-main-part:active {
            background-color: #1c1c20;
            transform: scale(0.98);
        }

        .launcher-edit-part {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: transparent;
            transition: background-color 0.2s, transform 0.15s;
        }
        .launcher-edit-part:active {
            background-color: rgba(41, 151, 255, 0.2);
            transform: scale(0.96);
        }
        .launcher-edit-icon {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .launcher-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .launcher-icon {
            font-size: 15px;

        function syncPreferenceToggleStates() {
            document.querySelectorAll(".pref-theme-toggle").forEach(el => el.checked = lightThemeEnabled);

            document.querySelectorAll(".pref-advice-toggle").forEach(el => el.checked = adviceFeatureEnabled);

        function setupPreferencesCarousel(container) {
            if (container._hasPrefScrollListener) return;
            container._hasPrefScrollListener = true;

            container.addEventListener('scroll', () => {
                const scrollLeft = container.scrollLeft;
                const panelWidth = container.clientWidth;
                if (panelWidth === 0) return;

                if (scrollLeft <= 1) {
                    container.style.scrollBehavior = 'auto';
                    container.style.scrollSnapType = 'none';
                    container.scrollLeft = 2 * panelWidth;
                    requestAnimationFrame(() => {
                        container.style.scrollSnapType = 'x mandatory';
                        container.style.scrollBehavior = 'smooth';
                    });
                    return;
                }

                const rightThreshold = 3 * panelWidth - 1;
                if (scrollLeft >= rightThreshold) {
                    container.style.scrollBehavior = 'auto';
                    container.style.scrollSnapType = 'none';
                    container.scrollLeft = 1 * panelWidth;
                    requestAnimationFrame(() => {
                        container.style.scrollSnapType = 'x mandatory';
                        container.style.scrollBehavior = 'smooth';
                    });
                }
            }, { passive: true });
        }

        function jumpToPage(index) {
            currentViewIndex = index;
            localStorage.setItem('lab_viewIndex', index);

            const panels = document.querySelectorAll('.view-panel');
            panels.forEach((p, idx) => {
                if (idx === index) {
                    p.classList.add('active');
                    requestAnimationFrame(() => {
                        const container = p.querySelector('.card-carousel-container');
                        if (container && container.clientWidth > 0) {
                            let activeRealIndex = 0;
                            if (idx === 0) {
                                const visiblePcrList = pcrOrderConfig.filter(p => p.visible);
                                activeRealIndex = visiblePcrList.findIndex(p => p.key === currentPcrKey);
                            } else if (idx === 1) {
                                const visibleMediaList = mediaOrderConfig.filter(m => m.visible);
                                activeRealIndex = visibleMediaList.findIndex(m => m.key === currentMediaKey);
                            } else if (idx === 2) {
                                const visibleElecList = electrophoresisOrderConfig.filter(e => e.visible);
                                activeRealIndex = visibleElecList.findIndex(e => e.key === currentElecKey);
                            } else if (idx === 3) {
                                const visibleAgroList = agroOrderConfig.filter(a => a.visible);
                                activeRealIndex = visibleAgroList.findIndex(a => a.key === currentAgroKey);
                            } else if (idx === 4) {
                                const visibleProtoList = protoplastOrderConfig.filter(pr => pr.visible);
                                activeRealIndex = visibleProtoList.findIndex(pr => pr.key === currentProtoKey);
                            } else if (idx === 5) {
                                const visibleSolList = solutionOrderConfig.filter(s => s.visible);
                                activeRealIndex = visibleSolList.findIndex(s => s.key === currentSolutionKey);
                            } else if (idx === 6) {
                                const guideKeys = Object.keys(guideDatabase);
                                activeRealIndex = guideKeys.indexOf(currentGuideKey);
                            } else if (idx === 7) {
                                activeRealIndex = 0;
                            }
                            if (activeRealIndex !== -1) {
                                container.style.scrollBehavior = 'auto';
                                container.scrollLeft = (activeRealIndex + 1) * container.clientWidth;
                                requestAnimationFrame(() => {
                                    container.style.scrollBehavior = 'smooth';
                                });
                            }
                        }
                    });
                } else {
                    p.classList.remove('active');
                }
            });
            updateLauncherBar();
        }

        function toggleCurrentFavorite() {
            const info = getCurrentActiveItemInfo();
            if (!info) return;

            const isChecked = document.getElementById("favSwitchInput").checked;
            const index = favorites.findIndex(f => f.type === info.type && f.key === info.key);

            if (isChecked && index === -1) {
                favorites.push({ type: info.type, key: info.key, name: info.name });
            } else if (!isChecked && index !== -1) {
                favorites.splice(index, 1);
            }
            localStorage.setItem('lab_favorites', JSON.stringify(favorites));
            renderFavoriteEditList();
        }

        function moveFavoriteItem(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= favorites.length) return;
            const temp = favorites[index];
            favorites[index] = favorites[newIndex];
            favorites[newIndex] = temp;
            localStorage.setItem('lab_favorites', JSON.stringify(favorites));
            renderFavoriteEditList();
        }

        function removeFavoriteItem(index) {
            favorites.splice(index, 1);
            localStorage.setItem('lab_favorites', JSON.stringify(favorites));
            renderFavoriteEditList();

        function getTargetConfig(type) {
            if (type === 'media') return mediaOrderConfig;
            if (type === 'solution') return solutionOrderConfig;
            if (type === 'electrophoresis') return electrophoresisOrderConfig;
            if (type === 'agro') return agroOrderConfig;
            if (type === 'protoplast') return protoplastOrderConfig;
            if (type === 'pcr') return pcrOrderConfig;
            return [];
        }

        function saveTargetConfig(type, config) {
            if (type === 'media') {
                mediaOrderConfig = config;
                localStorage.setItem('lab_mediaOrderConfig', JSON.stringify(config));
            } else if (type === 'solution') {
                solutionOrderConfig = config;
                localStorage.setItem('lab_solutionOrderConfig', JSON.stringify(config));
            } else if (type === 'electrophoresis') {
                electrophoresisOrderConfig = config;
                localStorage.setItem('lab_electrophoresisOrderConfig', JSON.stringify(config));
            } else if (type === 'agro') {
                agroOrderConfig = config;
                localStorage.setItem('lab_agroOrderConfig', JSON.stringify(config));
            } else if (type === 'protoplast') {
                protoplastOrderConfig = config;
                localStorage.setItem('lab_protoplastOrderConfig', JSON.stringify(config));
            } else if (type === 'pcr') {
                pcrOrderConfig = config;
                localStorage.setItem('lab_pcrOrderConfig', JSON.stringify(config));
            }
        }

        function toggleItemVisible(type, index) {
            let config = getTargetConfig(type);
            config[index].visible = !config[index].visible;
            saveTargetConfig(type, config);
            renderOrderList();
            updateView();
        }

        function moveItem(type, index, direction) {
            let config = getTargetConfig(type);
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= config.length) return;
            
            const temp = config[index];
            config[index] = config[newIndex];
            config[newIndex] = temp;

            saveTargetConfig(type, config);
            renderOrderList();
            updateView();
        }

            syncPreferenceToggleStates();
            if (!checkFeatureEnabled) {
                document.querySelectorAll('.ingredient-item.checked').forEach(item => item.classList.remove('checked'));

        function checkResetButtonState(type) {
            let containerId = "";
            if (type === 'media') containerId = 'mediaCarouselContainer';
            else if (type === 'solution') containerId = 'solutionCarouselContainer';
            else if (type === 'elec') containerId = 'electrophoresisCarouselContainer';
            else if (type === 'agro') containerId = 'agroCarouselContainer';
            else if (type === 'proto') containerId = 'protoplastCarouselContainer';
            else containerId = 'pcrCarouselContainer';
            
            const container = document.getElementById(containerId);
            if (!container) return;

            const activePanel = container.querySelector('.card-carousel-panel:not([style*="display: none"])');
            const checkedCount = activePanel ? activePanel.querySelectorAll('.ingredient-item.checked').length : 0;
            const banners = container.querySelectorAll('.reset-banner');
            
            banners.forEach(b => {
                if (checkedCount > 0 && checkFeatureEnabled) {
                    b.classList.add('visible');
                } else {
                    b.classList.remove('visible');
                }
            });
        }

        function resetChecks(type) {
            let containerId = "";
            if (type === 'media') containerId = 'mediaCarouselContainer';
            else if (type === 'solution') containerId = 'solutionCarouselContainer';
            else if (type === 'elec') containerId = 'electrophoresisCarouselContainer';
            else if (type === 'agro') containerId = 'agroCarouselContainer';
            else if (type === 'proto') containerId = 'protoplastCarouselContainer';
            else containerId = 'pcrCarouselContainer';

            const container = document.getElementById(containerId);
            if (container) {
                const activePanel = container.querySelector('.card-carousel-panel:not([style*="display: none"])');
                if (activePanel) {
                    activePanel.querySelectorAll('.ingredient-item.checked').forEach(el => {
                        el.classList.remove('checked');
                    });
                }
            }
            checkResetButtonState(type);
        }

        function openInfoModal() {
            let infoData = null;
            if (currentViewIndex === 0) {
                const pcr = pcrDatabase[currentPcrKey];
                if (pcr && pcr.info) infoData = pcr.info;
            } else if (currentViewIndex === 1) {
                const media = mediaDatabase[currentMediaKey];
                if (media && media.info) infoData = media.info;
            } else if (currentViewIndex === 2) {
                const elec = commonReagentDatabase[currentElecKey];
                if (elec && elec.info) infoData = elec.info;
            } else if (currentViewIndex === 3) {
                const agro = commonReagentDatabase[currentAgroKey];
                if (agro && agro.info) infoData = agro.info;
            } else if (currentViewIndex === 4) {
                const proto = commonReagentDatabase[currentProtoKey];
                if (proto && proto.info) infoData = proto.info;
            } else if (currentViewIndex === 5) {
                const sol = commonReagentDatabase[currentSolutionKey];
                if (sol && sol.info) infoData = sol.info;
            }

            if (infoData) {
                document.getElementById("infoModalTitle").innerHTML = `${infoData.title}`;
                document.getElementById("infoModalBody").innerHTML = infoData.body;
                openModal('infoModal');

                                <div class="main-display">

                                        <div class="media-title-wrapper" onclick="openModal('electrophoresisModal')">
                                            <span class="media-eyebrow">${eData.eyebrow}</span>
                                            <div class="media-title-row">
                                                <h1 class="media-title">${eData.fullName}</h1>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="advice-box ${adviceFeatureEnabled ? 'visible' : ''}">${eData.advice}</div>
                                    
                                    <div class="list-container-wrapper" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 10px 0;">
                                        <div style="background: #000; border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 16px; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 2px 10px rgba(0,0,0,0.8); width: 100%; flex: 1; max-height: 280px;">
                                            <img src="${eData.image}" alt="${eData.name}" style="max-height: 100%; max-width: 100%; object-fit: contain; filter: drop-shadow(0 0 8px rgba(255,255,255,0.1));">
                                        </div>
                                        <div style="font-size: 14px; color: var(--text-secondary); text-align: center; line-height: 1.5; padding: 0 8px;">
                                            <b style="color: var(--text-primary);">EcoT14i切断ラムダDNAマーカー</b><br>500bp以上（通常1500bp以上）のバンド識別向け
                                        </div>
                                    </div>

                                    ${infoButtonFeatureEnabled ? `
                                        <button class="card-info-footer-btn" onclick="openInfoModal()">
                                            <span>このマーカーの解説を見る</span>
                                        </button>
                                    ` : ''}
                                </div>
                            `;
                            elecCarouselContainer.appendChild(panel);
                        } else {
                            const vol = currentElecVolumes[eKey] || eData.baseVolume;
                            renderGenericRecipePanel(elecCarouselContainer, eData, vol, `openElecVolumeModal('${eKey}')`, 'elec', loopIdx);
                        }
                    });

                    const activeElecIndex = visibleElecList.findIndex(e => e.key === currentElecKey);
                    if (activeElecIndex !== -1) {
                        const targetScrollLeft = (activeElecIndex + 1) * elecCarouselContainer.clientWidth;
                        if (instantJump) {
                            elecCarouselContainer.style.scrollBehavior = 'auto';
                            elecCarouselContainer.scrollLeft = targetScrollLeft;
                            requestAnimationFrame(() => {
                                requestAnimationFrame(() => {
                                    elecCarouselContainer.style.scrollBehavior = 'smooth';
                                });
                            });
                        } else {
                            setTimeout(() => {
                                elecCarouselContainer.scrollLeft = targetScrollLeft;
                            }, 10);
                        }
                    }

                    setupInfiniteCarouselSwipe(elecCarouselContainer, visibleElecList, (newKey) => {
                        currentElecKey = newKey;
                        localStorage.setItem('lab_elecKey', newKey);
                    });

                    checkResetButtonState('elec');
                }
            }

            // --- 4. アグロバクテリウムビュー ---
            const agroCarouselContainer = document.getElementById("agroCarouselContainer");
            if (agroCarouselContainer) {
                agroCarouselContainer.innerHTML = "";
                const visibleAgroList = agroOrderConfig.filter(a => a.visible);
                if (!visibleAgroList.map(a => a.key).includes(currentAgroKey) && visibleAgroList.length > 0) {
                    currentAgroKey = visibleAgroList[0].key;
                }

                if (visibleAgroList.length > 0) {
                    const loopAgroList = [visibleAgroList[visibleAgroList.length - 1], ...visibleAgroList, visibleAgroList[0]];

                    loopAgroList.forEach((aObj, loopIdx) => {
                        const aKey = aObj.key;
                        const aData = commonReagentDatabase[aKey];
                        if (!aData) return;

                        const vol = currentAgroVolumes[aKey] || aData.baseVolume;
                        renderGenericRecipePanel(agroCarouselContainer, aData, vol, `openAgroVolumeModal('${aKey}')`, 'agro', loopIdx);
                    });

                    const activeAgroIndex = visibleAgroList.findIndex(a => a.key === currentAgroKey);
                    if (activeAgroIndex !== -1) {
                        const targetScrollLeft = (activeAgroIndex + 1) * agroCarouselContainer.clientWidth;
                        if (instantJump) {
                            agroCarouselContainer.style.scrollBehavior = 'auto';
                            agroCarouselContainer.scrollLeft = targetScrollLeft;
                            requestAnimationFrame(() => {
                                requestAnimationFrame(() => {
                                    agroCarouselContainer.style.scrollBehavior = 'smooth';
                                });
                            });
                        } else {
                            setTimeout(() => {
                                agroCarouselContainer.scrollLeft = targetScrollLeft;
                            }, 10);
                        }
                    }

                    setupInfiniteCarouselSwipe(agroCarouselContainer, visibleAgroList, (newKey) => {
                        currentAgroKey = newKey;
                        localStorage.setItem('lab_agroKey', newKey);
                    });

                    checkResetButtonState('agro');
                }
            }

            // --- 5. プロトプラストビュー ---
            const protoCarouselContainer = document.getElementById("protoplastCarouselContainer");
            if (protoCarouselContainer) {
                protoCarouselContainer.innerHTML = "";
                const visibleProtoList = protoplastOrderConfig.filter(p => p.visible);
                if (!visibleProtoList.map(p => p.key).includes(currentProtoKey) && visibleProtoList.length > 0) {
                    currentProtoKey = visibleProtoList[0].key;
                }

                if (visibleProtoList.length > 0) {
                    const loopProtoList = [visibleProtoList[visibleProtoList.length - 1], ...visibleProtoList, visibleProtoList[0]];

                    loopProtoList.forEach((pObj, loopIdx) => {
                        const pKey = pObj.key;
                        const pData = commonReagentDatabase[pKey];
                        if (!pData) return;

                        const vol = currentProtoVolumes[pKey] || pData.baseVolume;
                        renderGenericRecipePanel(protoCarouselContainer, pData, vol, `openProtoVolumeModal('${pKey}')`, 'proto', loopIdx);
                    });

                    const activeProtoIndex = visibleProtoList.findIndex(p => p.key === currentProtoKey);
                    if (activeProtoIndex !== -1) {
                        const targetScrollLeft = (activeProtoIndex + 1) * protoCarouselContainer.clientWidth;
                        if (instantJump) {
                            protoCarouselContainer.style.scrollBehavior = 'auto';
                            protoCarouselContainer.scrollLeft = targetScrollLeft;
                            requestAnimationFrame(() => {
                                requestAnimationFrame(() => {
                                    protoCarouselContainer.style.scrollBehavior = 'smooth';
                                });
                            });
                        } else {
                            setTimeout(() => {
                                protoCarouselContainer.scrollLeft = targetScrollLeft;
                            }, 10);
                        }
                    }

                    setupInfiniteCarouselSwipe(protoCarouselContainer, visibleProtoList, (newKey) => {
                        currentProtoKey = newKey;
                        localStorage.setItem('lab_protoKey', newKey);
                    });

                    checkResetButtonState('proto');
                }
            }

            // --- 6. ストック溶液 カードカルーセル ---
            const solCarouselContainer = document.getElementById("solutionCarouselContainer");
            if (solCarouselContainer) {
                solCarouselContainer.innerHTML = "";
                const visibleSolList = solutionOrderConfig.filter(s => s.visible);
                if (!visibleSolList.map(s => s.key).includes(currentSolutionKey) && visibleSolList.length > 0) {
                    currentSolutionKey = visibleSolList[0].key;
                }

                if (visibleSolList.length > 0) {
                    const loopSolList = [visibleSolList[visibleSolList.length - 1], ...visibleSolList, visibleSolList[0]];

                    loopSolList.forEach((sObj, loopIdx) => {
                        const sKey = sObj.key;
                        const sData = commonReagentDatabase[sKey];
                        if (!sData) return;

                        renderGenericRecipePanel(solCarouselContainer, sData, currentSolutionVolume, "openModal('solutionVolumeModal')", 'solution', loopIdx);
                    });

                    const activeSolIndex = visibleSolList.findIndex(s => s.key === currentSolutionKey);
                    if (activeSolIndex !== -1) {
                        const targetScrollLeft = (activeSolIndex + 1) * solCarouselContainer.clientWidth;
                        if (instantJump) {
                            solCarouselContainer.style.scrollBehavior = 'auto';
                            solCarouselContainer.scrollLeft = targetScrollLeft;
                            requestAnimationFrame(() => {
                                requestAnimationFrame(() => {
                                    solCarouselContainer.style.scrollBehavior = 'smooth';
                                });
                            });
                        } else {
                            setTimeout(() => {
                                solCarouselContainer.scrollLeft = targetScrollLeft;
                            }, 10);
                        }
                    }

                    setupInfiniteCarouselSwipe(solCarouselContainer, visibleSolList, (newKey) => {
                        currentSolutionKey = newKey;
                        localStorage.setItem('lab_solutionKey', newKey);
                    });

                    checkResetButtonState('solution');
                }
            }

            // --- 7. ガイド カードカルーセル ---
            const guide = guideDatabase[currentGuideKey];
            if (guide) {
                const guideCarouselContainer = document.getElementById("guideCarouselContainer");
                guideCarouselContainer.innerHTML = "";

                const guideKeys = Object.keys(guideDatabase);
                if (!guideKeys.includes(currentGuideKey)) {
                    currentGuideKey = guideKeys[0];
                }

                if (guideKeys.length > 0) {
                    const loopGuideList = [guideKeys[guideKeys.length - 1], ...guideKeys, guideKeys[0]];

                    loopGuideList.forEach((gKey, loopIdx) => {
                        const gData = guideDatabase[gKey];
                        if (!gData) return;

                        const panel = document.createElement("div");
                        panel.className = "card-carousel-panel";
                        panel.innerHTML = `
                            <div class="main-display">
                                <div class="display-header">
                                    <div class="media-title-wrapper" onclick="openModal('guideModal')">
                                        <span class="media-eyebrow">${gData.eyebrow}</span>
                                        <div class="media-title-row">
                                            <h1 class="media-title">${gData.name}</h1>
                                        </div>
                                    </div>
                                </div>
                                <div class="list-container-wrapper">
                                    <div class="guide-container" id="guideContent_${gKey}_${loopIdx}"></div>
                                </div>
                            </div>
                        `;
                        guideCarouselContainer.appendChild(panel);

                        const container = panel.querySelector(`#guideContent_${gKey}_${loopIdx}`);
                        gData.cards.forEach(card => {
                            const cardEl = document.createElement("div");
                            cardEl.className = "guide-card";
                            cardEl.innerHTML = `
                                <span class="guide-title">${card.title}</span>
                                <span class="guide-desc">${card.desc}</span>
                            `;
                            container.appendChild(cardEl);
                        });
                    });

                    const activeGuideIndex = guideKeys.indexOf(currentGuideKey);
                    if (activeGuideIndex !== -1) {
                        const targetScrollLeft = (activeGuideIndex + 1) * guideCarouselContainer.clientWidth;
                        if (instantJump) {
                            guideCarouselContainer.style.scrollBehavior = 'auto';
                            guideCarouselContainer.scrollLeft = targetScrollLeft;
                            requestAnimationFrame(() => {
                                requestAnimationFrame(() => {
                                    guideCarouselContainer.style.scrollBehavior = 'smooth';
                                });
                            });
                        } else {
                            setTimeout(() => {
                                guideCarouselContainer.scrollLeft = targetScrollLeft;
                            }, 10);
                        }
                    }

                    const guideObjList = guideKeys.map(k => ({ key: k }));
                    setupInfiniteCarouselSwipe(guideCarouselContainer, guideObjList, (newKey) => {
                        currentGuideKey = newKey;
                        localStorage.setItem('lab_guideKey', newKey);
                    });
                }
            }

            syncPreferenceToggleStates();
            buildMediaModals();
            buildElectrophoresisModals();
            buildAgroModals();
            buildProtoplastModals();
            buildSolutionModals();
            buildPcrModals();
            buildGuideModals();
            updateLauncherBar();
        }

        function setupInfiniteCarouselSwipe(containerEl, listItems, callback) {
            if (containerEl._hasScrollListener) return;
            containerEl._hasScrollListener = true;

            containerEl.addEventListener('scroll', () => {
                const scrollLeft = containerEl.scrollLeft;
                const panelWidth = containerEl.clientWidth;
                const totalItems = listItems.length;
                if (panelWidth === 0) return;

                if (scrollLeft <= 1) {
                    containerEl.style.scrollBehavior = 'auto';
                    containerEl.style.scrollSnapType = 'none';
                    containerEl.scrollLeft = totalItems * panelWidth;
                    requestAnimationFrame(() => {
                        containerEl.style.scrollSnapType = 'x mandatory';
                        containerEl.style.scrollBehavior = 'smooth';
                    });
                    callback(listItems[totalItems - 1].key);
                    return;
                }

                const rightCloneThreshold = (totalItems + 1) * panelWidth - 1;
                if (scrollLeft >= rightCloneThreshold) {
                    containerEl.style.scrollBehavior = 'auto';
                    containerEl.style.scrollSnapType = 'none';
                    containerEl.scrollLeft = panelWidth;
                    requestAnimationFrame(() => {
                        containerEl.style.scrollSnapType = 'x mandatory';
                        containerEl.style.scrollBehavior = 'smooth';
                    });
                    callback(listItems[0].key);
                    return;
                }

                const currentIndex = Math.round(scrollLeft / panelWidth);
                const realIndex = currentIndex - 1;
                if (realIndex >= 0 && realIndex < totalItems) {
                    const selectedKey = listItems[realIndex].key;
                    let currentKey = "";
                    if (containerEl.id === 'pcrCarouselContainer') currentKey = currentPcrKey;
                    else if (containerEl.id === 'mediaCarouselContainer') currentKey = currentMediaKey;
                    else if (containerEl.id === 'electrophoresisCarouselContainer') currentKey = currentElecKey;
                    else if (containerEl.id === 'agroCarouselContainer') currentKey = currentAgroKey;
                    else if (containerEl.id === 'protoplastCarouselContainer') currentKey = currentProtoKey;
                    else if (containerEl.id === 'solutionCarouselContainer') currentKey = currentSolutionKey;
                    else if (containerEl.id === 'guideCarouselContainer') currentKey = currentGuideKey;

                    if (selectedKey !== currentKey) {
                        callback(selectedKey);
                    }
                }
            }, { passive: true });
        }

        function openModal(modalId) {
            if (modalId === 'volumeModal') {
                const volListEl = document.getElementById("volumeOptionsList");
                if (volListEl) volListEl.style.removeProperty('display');
                const keypadEl = document.getElementById("keypadContainer");
                if (keypadEl) keypadEl.style.display = "none";
                document.getElementById("volumeModalHeader").textContent = "作製容量を選択";

                volListEl.querySelectorAll('.option-item').forEach(btn => {
                    const val = parseInt(btn.textContent.trim(), 10);
                    btn.classList.toggle('selected', val === currentVolume);
                });
            } else if (modalId === 'solutionVolumeModal') {
                const solVolListEl = document.getElementById("solutionVolumeOptionsList");
                if (solVolListEl) solVolListEl.style.removeProperty('display');
                const solKeypadEl = document.getElementById("solutionKeypadContainer");
                if (solKeypadEl) solKeypadEl.style.display = "none";
                document.getElementById("solutionVolumeModalHeader").textContent = "作製容量を選択";

                solVolListEl.querySelectorAll('.option-item').forEach(btn => {
                    const val = parseInt(btn.textContent.trim(), 10);
                    btn.classList.toggle('selected', val === currentSolutionVolume);
                });
            } else if (modalId === 'pcrVolumeModal') {
                const pcrVolListEl = document.getElementById("pcrVolumeOptionsList");
                if (pcrVolListEl) pcrVolListEl.style.removeProperty('display');
                const pcrKeypadEl = document.getElementById("pcrKeypadContainer");
                if (pcrKeypadEl) pcrKeypadEl.style.display = "none";
                document.getElementById("pcrVolumeModalHeader").textContent = "反応液量を選択";

                pcrVolListEl.querySelectorAll('.option-item').forEach(btn => {
                    const val = parseInt(btn.textContent.trim(), 10);
                    btn.classList.toggle('selected', val === currentPcrVolume);
                });
            }
            document.getElementById(modalId).classList.add("active");
        }

        function closeModal(modalId) {
            document.exitFullscreen ? document.exitFullscreen().catch(()=>{}) : null;
            document.getElementById(modalId).classList.remove("active");
        }

        function outsideClose(event, modalId) {
            if (event.target.id === modalId) {
                closeModal(modalId);
            }
        }

        window.onload = initApp;
    </script>
</body>
